[project]
name = "agent-lab"
version = "0.1.0"
description = "A tool-using travel planning agent, built by hand on the Anthropic API and again with LangGraph"
readme = "README.md"
authors = [
    { name = "lizzx666", email = "shisanyue58@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.1.0",
    "langchain-anthropic>=1.7.4",
    "langgraph>=1.2.12",
    "openai>=3.5.0",
    "python-dotenv>=1.2.3",
]

[project.scripts]
agent-lab = "agent_lab:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"
